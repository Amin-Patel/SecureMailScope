server {
    listen 80;
    server_name mailscope.dpdns.org;

    # Redirect HTTP → HTTPS (handled by your reverse proxy / Cloudflare / Caddy above nginx)
    # If you use Certbot/Let's Encrypt directly on this server, replace this block with the
    # Let's Encrypt include directives that certbot generates.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mailscope.dpdns.org;

    # TLS certificates — update these paths to your actual cert locations
    ssl_certificate     /etc/nginx/ssl/mailscope.dpdns.org.crt;
    ssl_certificate_key /etc/nginx/ssl/mailscope.dpdns.org.key;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (1 year; include subdomains so api. is also covered)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Serve the React/Vite SPA static files
    root /var/www/mailscope/dist;
    index index.html;

    # Cache static assets aggressively (Vite uses content hashes)
    location ~* \.(js|css|woff2?|png|svg|ico|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
}

# ──────────────────────────────────────────────────────────────
# API subdomain reverse proxy → FastAPI backend on port 8001
# ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.mailscope.dpdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.mailscope.dpdns.org;

    ssl_certificate     /etc/nginx/ssl/mailscope.dpdns.org.crt;
    ssl_certificate_key /etc/nginx/ssl/mailscope.dpdns.org.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Upload size limit — matches backend MAX_FILE_SIZE (100MB)
    client_max_body_size 105M;

    # Proxy timeouts — PCAP analysis can take a while
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering    off;
    }
}
